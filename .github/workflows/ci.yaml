name: Hello World CI Pipeline

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: python -m pip install PyYAML

      - name: Validate CI YAML
        run: python validate_ci.py

      - name: Build HTML page
        run: |
          chmod +x build.sh
          ./build.sh

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test Hello World script
        run: |
          chmod +x hello.sh
          output=$(./hello.sh)
          echo "$output"
          test "$output" = "Hello, world!"

      - name: Test generated HTML
        run: |
          python -m pip install PyYAML
          python validate_ci.py
          chmod +x build.sh
          ./build.sh
          test -f build/site/index.html
          grep -q "DevOps Assessment" build/site/index.html
          echo "HTML test successful"

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy confirmation
        run: echo "Deployment successful!"
